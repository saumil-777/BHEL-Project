version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smimp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smimp_db
      POSTGRES_USER: smimp_user
      POSTGRES_PASSWORD: smimp_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smimp_user -d smimp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smimp_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://smimp_user:smimp_pass@postgres:5432/smimp_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey2024smimp}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refreshsecretkey2024smimp}
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smimp_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:5000/api

volumes:
  postgres_data:
  uploads_data:
